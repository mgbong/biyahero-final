<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Feedback — Biyahero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css" />
  <link rel="stylesheet" href="../css/shared.css" />
  <link rel="stylesheet" href="../css/commuter.css" />
  <link rel="stylesheet" href="../css/static-inline.css">
</head>
<body>



  <div class="app-shell" id="app-shell">


    <aside class="sidebar" role="navigation" aria-label="Commuter navigation">
      <a class="sidebar-brand" href="dashboard.html">
        <span class="sidebar-brand-mark" aria-hidden="true"><i class="ri-bus-line"></i></span>
        Biyahero
      </a>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><i class="ri-dashboard-line"></i> Dashboard</a>
        <a href="plan-trip.html"><i class="ri-route-line"></i> Plan Trip</a>
        <a href="fare-guide.html"><i class="ri-wallet-3-line"></i> Fare Guide</a>
        <a href="routes.html"><i class="ri-map-2-line"></i> Routes</a>
        <a href="updates.html"><i class="ri-traffic-light-line"></i> Traffic Updates</a>
        <a href="report.html"><i class="ri-flag-line"></i> Report Issue</a>
        <a href="feedback.html" class="active"><i class="ri-feedback-line"></i> Feedback</a>
        <a href="commuter-profile.html"><i class="ri-user-line"></i> Profile</a>
      </nav>
      <div class="sidebar-footer">
        <a class="btn-logout" href="login.html"><i class="ri-logout-box-line"></i> Log Out</a>
      </div>
    </aside>

    <div class="main-content">
      <header class="page-header">
        <div class="page-header-left">
          <span class="breadcrumb-current">Submit Feedback</span>
        </div>
        <div class="page-header-right">
          <div class="user-chip">
            <div class="user-avatar">MC</div>
            <span class="user-name">Maya Cruz</span>
          </div>
        </div>
      </header>

      <main class="page-body">


        <div id="feedback-form-section">
          <div class="card static-inline-001">
            <h2 class="section-title static-inline-011">Share Your Feedback</h2>

            <div id="form-error" class="input-error-msg"></div>

            <div class="form-group">
              <label for="category">Category *</label>
              <select id="category" disabled>
                <option value="" disabled selected>Select a category</option>
                <option value="App Experience">App Experience</option>
                <option value="Route Information Accuracy">Route Information Accuracy</option>
                <option value="Driver Behavior">Driver Behavior</option>
                <option value="General">General</option>
              </select>
            </div>

            <div class="form-group">
              <label>Example Rating</label>
              <div class="star-rating static-inline-023" aria-label="Sample rating, four out of five stars">★★★★<span class="static-inline-024">★</span></div>
            </div>

            <div class="form-group">
              <label for="message">Message * <span class="static-inline-025">(min. 10 characters)</span></label>
              <textarea id="message" rows="5" placeholder="Share your thoughts, suggestions, or experience…" minlength="10" readonly></textarea>
            </div>

            <span class="btn btn-primary">
              <i class="ri-send-plane-line"></i> Submit Feedback
            </span>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
