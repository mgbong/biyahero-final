<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — Biyahero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css" />
  <link rel="stylesheet" href="../css/shared.css" />
  <link rel="stylesheet" href="../css/commuter.css" />
  <link rel="stylesheet" href="../css/static-inline.css">
  <style>
    /* ── Profile layout ─────────────────────────────────── */
    .profile-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 768px) {
      .profile-grid { grid-template-columns: 1fr; }
    }

    /* ── Identity card (left column) ────────────────────── */
    .profile-id-card {
      background: var(--teal, #111A41);
      border-radius: 14px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #fff;
      text-align: center;
    }
    .profile-avatar-xl {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 700;
      letter-spacing: 1px;
      border: 3px solid rgba(255,255,255,0.3);
    }
    .profile-id-name  { font-size: 18px; font-weight: 700; margin-top: 4px; }
    .profile-id-email { font-size: 13px; opacity: .75; word-break: break-all; }
    .profile-id-since { font-size: 12px; opacity: .55; margin-top: 4px; }

    /* ── Edit card (right column) ───────────────────────── */
    .profile-edit-card {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #e8eaf0;
      padding: 28px 28px 24px;
    }
    .profile-edit-card__title {
      font-size: 16px; font-weight: 700;
      color: var(--teal, #111A41);
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 8px;
    }
    .profile-form-group {
      margin-bottom: 16px;
    }
    .profile-form-group label {
      display: block;
      font-size: 12px; font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 6px;
    }
    .profile-form-group input {
      width: 100%; box-sizing: border-box;
      padding: 10px 12px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #111827;
      background: #f9fafb;
      transition: border-color 150ms;
    }
    .profile-form-group input:focus {
      outline: none;
      border-color: var(--teal, #111A41);
      background: #fff;
    }
    .profile-form-group input[readonly] {
      background: #f3f4f6;
      color: #9ca3af;
      cursor: not-allowed;
    }
    .profile-form-hint {
      font-size: 11px; color: #9ca3af; margin-top: 4px;
    }
    .profile-form-divider {
      border: none; border-top: 1px solid #e8eaf0;
      margin: 20px 0;
    }
    .profile-form-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    }
    @media (max-width: 540px) {
      .profile-form-row { grid-template-columns: 1fr; }
    }
    .profile-save-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 22px;
      background: var(--teal, #111A41);
      color: #fff;
      border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      transition: opacity 150ms;
    }
    .profile-save-btn:hover  { opacity: .88; }
    .profile-save-btn:disabled { opacity: .5; cursor: not-allowed; }

    .profile-feedback {
      margin-top: 12px;
      font-size: 13px; font-weight: 500;
      min-height: 20px;
    }
    .profile-feedback--ok    { color: #16a34a; }
    .profile-feedback--error { color: #dc2626; }
  </style>
</head>
<body>
  <div class="app-shell" id="app-shell">

    <aside class="sidebar" role="navigation" aria-label="Commuter navigation">
      <a class="sidebar-brand" href="dashboard.html">
        <span class="sidebar-brand-mark" aria-hidden="true"><i class="ri-bus-line"></i></span>
        Biyahero
      </a>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><i class="ri-dashboard-line"></i> Dashboard</a>
        <a href="plan-trip.html"><i class="ri-route-line"></i> Plan Trip</a>
        <a href="fare-guide.html"><i class="ri-wallet-3-line"></i> Fare Guide</a>
        <a href="routes.html"><i class="ri-map-2-line"></i> Routes</a>
        <a href="updates.html"><i class="ri-traffic-light-line"></i> Traffic Updates</a>
        <a href="report.html"><i class="ri-flag-line"></i> Report Issue</a>
        <a href="feedback.html"><i class="ri-feedback-line"></i> Feedback</a>
        <a href="commuter-profile.html" class="active"><i class="ri-user-line"></i> Profile</a>
      </nav>
      <div class="sidebar-footer">
        <a class="btn-logout" href="#"><i class="ri-logout-box-line"></i> Log Out</a>
      </div>
    </aside>

    <div class="main-content">
      <header class="page-header">
        <div class="page-header-left">
          <span class="breadcrumb-current">My Profile</span>
        </div>
        <div class="page-header-right">
          <div class="user-chip">
            <div class="user-avatar">??</div>
            <span class="user-name">Loading…</span>
          </div>
        </div>
      </header>

      <main class="page-body">
        <div class="profile-grid">

          <!-- Left: identity card -->
          <div class="profile-id-card">
            <div class="profile-avatar-xl" id="profile-avatar">??</div>
            <div class="profile-id-name"  id="profile-name">Loading…</div>
            <div class="profile-id-email" id="profile-email"></div>
            <span class="badge badge-teal"><i class="ri-user-line"></i> Commuter</span>
            <div class="profile-id-since" id="profile-since"></div>
          </div>

          <!-- Right: edit form -->
          <div class="profile-edit-card">
            <div class="profile-edit-card__title">
              <i class="ri-edit-line"></i> Edit Profile
            </div>

            <form id="profile-form" novalidate>
              <div class="profile-form-row">
                <div class="profile-form-group">
                  <label for="edit-fullname">Full Name</label>
                  <input type="text" id="edit-fullname" name="fullname"
                         placeholder="Your full name" required />
                </div>
                <div class="profile-form-group">
                  <label for="edit-contact">Mobile Number</label>
                  <input type="text" id="edit-contact" name="contact"
                         placeholder="+63 9XX XXX XXXX" />
                </div>
              </div>

              <div class="profile-form-group">
                <label for="edit-email">Email Address</label>
                <input type="email" id="edit-email" name="email" readonly />
                <p class="profile-form-hint">Email cannot be changed.</p>
              </div>

              <hr class="profile-form-divider" />
              <div class="profile-edit-card__title" style="font-size:14px; margin-bottom:16px;">
                <i class="ri-lock-line"></i> Change Password
                <span style="font-size:12px; font-weight:400; color:#6b7280;">(leave blank to keep current)</span>
              </div>

              <div class="profile-form-group">
                <label for="edit-current-pw">Current Password</label>
                <input type="password" id="edit-current-pw" name="current_password"
                       placeholder="Enter current password" autocomplete="current-password" />
              </div>
              <div class="profile-form-row">
                <div class="profile-form-group">
                  <label for="edit-new-pw">New Password</label>
                  <input type="password" id="edit-new-pw" name="new_password"
                         placeholder="Min 8 characters" autocomplete="new-password" minlength="8" />
                </div>
                <div class="profile-form-group">
                  <label for="edit-confirm-pw">Confirm New Password</label>
                  <input type="password" id="edit-confirm-pw" name="confirm_password"
                         placeholder="Repeat new password" autocomplete="new-password" />
                </div>
              </div>

              <button type="submit" class="profile-save-btn" id="save-btn">
                <i class="ri-save-line"></i> Save Changes
              </button>
              <p class="profile-feedback" id="profile-feedback" role="status" aria-live="polite"></p>
            </form>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="../js/user.js"></script>
  <script>
    // Wait for user.js to populate window.biyaheroUser, then fill the form
    (function waitForUser(retries) {
      const user = window.biyaheroUser;
      if (!user && retries > 0) {
        return setTimeout(() => waitForUser(retries - 1), 80);
      }
      if (!user) return;
      populateForm(user);
    })(25);

    function formatDate(iso) {
      if (!iso) return "";
      const d = new Date(iso.replace(" ", "T") + (iso.includes("T") ? "" : "Z"));
      return d.toLocaleDateString("en-PH", { year: "numeric", month: "long", day: "numeric" });
    }

    function populateForm(user) {
      document.getElementById("profile-avatar").textContent = user.initials || "??";
      document.getElementById("profile-name").textContent   = user.fullname || "";
      document.getElementById("profile-email").textContent  = user.email    || "";
      document.getElementById("profile-since").textContent  =
        user.created_at ? "Member since " + formatDate(user.created_at) : "";

      document.getElementById("edit-fullname").value = user.fullname || "";
      document.getElementById("edit-contact").value  = user.contact  || "";
      document.getElementById("edit-email").value    = user.email    || "";
    }

    // Re-populate if user.js fires after the inline script
    window.addEventListener("biyahero-user-ready", (e) => populateForm(e.detail));

    // ── Form submit ──────────────────────────────────────
    const form       = document.getElementById("profile-form");
    const saveBtn    = document.getElementById("save-btn");
    const feedback   = document.getElementById("profile-feedback");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      feedback.textContent = "";
      feedback.className = "profile-feedback";

      const newPw     = document.getElementById("edit-new-pw").value;
      const confirmPw = document.getElementById("edit-confirm-pw").value;

      if (newPw && newPw !== confirmPw) {
        feedback.textContent = "New passwords do not match.";
        feedback.className = "profile-feedback profile-feedback--error";
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerHTML = '<i class="ri-loader-4-line"></i> Saving…';

      try {
        const res  = await fetch("/api/profile/update", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            fullname:         document.getElementById("edit-fullname").value.trim(),
            contact:          document.getElementById("edit-contact").value.trim(),
            current_password: document.getElementById("edit-current-pw").value,
            new_password:     newPw,
          }),
        });
        const data = await res.json();

        if (data.ok) {
          feedback.textContent = "Profile updated successfully.";
          feedback.className = "profile-feedback profile-feedback--ok";
          // Update identity card live
          document.getElementById("profile-avatar").textContent = data.initials || "??";
          document.getElementById("profile-name").textContent   = data.fullname || "";
          document.querySelectorAll(".user-avatar").forEach(el => el.textContent = data.initials || "??");
          document.querySelectorAll(".user-name").forEach(el   => el.textContent = data.fullname || "");
          // Clear password fields
          document.getElementById("edit-current-pw").value = "";
          document.getElementById("edit-new-pw").value     = "";
          document.getElementById("edit-confirm-pw").value = "";
        } else {
          feedback.textContent = data.error || "Could not save changes.";
          feedback.className = "profile-feedback profile-feedback--error";
        }
      } catch (_) {
        feedback.textContent = "Could not connect to the server.";
        feedback.className = "profile-feedback profile-feedback--error";
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<i class="ri-save-line"></i> Save Changes';
      }
    });
  </script>
</body>
</html>
