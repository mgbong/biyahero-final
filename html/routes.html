<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Routes — Biyahero</title>
  <link rel="preconnect" href="https://fonts.cdnfonts.com" />
  <link href="https://fonts.cdnfonts.com/css/mona-sans" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css" />
  <link rel="stylesheet" href="../css/shared.css" />
  <link rel="stylesheet" href="../css/commuter.css" />
  <link rel="stylesheet" href="../css/sm-shell.css" />
  <link rel="stylesheet" href="../css/route-info.css" />
</head>
<body class="sm-body">
  <a class="sm-skip" href="#main">Skip to content</a>

  <div class="sm-page" id="app-shell">
    <header class="sm-header">
      <a class="sm-logo" href="/" aria-label="Biyahero home">Biyahero</a>
      <nav class="sm-pillnav" aria-label="Main menu">
        <a href="dashboard.html" class="sm-pillnav__item">Home</a>
        <a href="plan-trip.html" class="sm-pillnav__item">Plan Trip</a>
        <a href="routes.html" class="sm-pillnav__item is-active" aria-current="page">Routes</a>
        <a href="fare-guide.html" class="sm-pillnav__item">Fares</a>
        <a href="updates.html" class="sm-pillnav__item">Updates</a>
        <a href="commuter-profile.html" class="sm-pillnav__item">Profile</a>
      </nav>
      <div class="sm-header__right">
        <div class="sm-user user-chip" title="Your account">
          <div class="sm-user__avatar user-avatar" aria-hidden="true">??</div>
          <span class="sm-user__name user-name">Loading…</span>
        </div>
        <button type="button" class="sm-iconbtn btn-logout" aria-label="Log out">
          <i class="ri-logout-box-r-line" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <main class="sm-main" id="main">
      <section class="sm-page-hero" aria-labelledby="page-hero-title">
        <div class="sm-page-hero__media" aria-hidden="true"></div>
        <div class="sm-page-hero__copy">
          <p class="sm-page-hero__eyebrow">Route information</p>
          <h1 class="sm-page-hero__title" id="page-hero-title">Routes</h1>
          <p class="sm-page-hero__sub">Browse jeepney and bus lines. No account needed.</p>
          <div class="sm-page-hero__actions">
            <a class="sm-btn sm-btn--orange" href="plan-trip.html">Plan a Trip <i class="ri-arrow-right-up-line" aria-hidden="true"></i></a>
            <a class="sm-btn sm-btn--glass" href="updates.html">View Advisories <i class="ri-arrow-right-up-line" aria-hidden="true"></i></a>
          </div>
        </div>
      </section>

      <div class="page-body ri-body">
        <div id="advisory-banner" aria-live="polite"></div>
        <div class="ri-toolbar">
          <label class="sr-only" for="route-search">Search routes</label>
          <input id="route-search" type="search" placeholder="Search by name, number, or stop" aria-label="Search routes" />
        </div>
        <div class="count-badge" id="count-badge"><i class="ri-route-line"></i> Loading…</div>
        <div id="routes-grid" aria-live="polite"></div>
      </div>
    </main>
  </div>
  <script src="../js/user-soft.js"></script>
  <script src="../js/route-info.js"></script>
</body>
</html>
